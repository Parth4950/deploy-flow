apiVersion: v1
kind: Service
metadata:
  name: healthcare-backend
  namespace: healthcare
spec:
  type: ClusterIP
  selector:
    app: healthcare-backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-frontend
  namespace: healthcare
spec:
  type: NodePort
  selector:
    app: healthcare-frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30082
